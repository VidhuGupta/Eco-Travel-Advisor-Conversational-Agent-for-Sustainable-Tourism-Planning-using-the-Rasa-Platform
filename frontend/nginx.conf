server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: index.html itself decides (client-side) whether to
    # render the traveler chat UI or the /admin dashboard, so every
    # unmatched path falls back to it instead of 404ing on a client route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
