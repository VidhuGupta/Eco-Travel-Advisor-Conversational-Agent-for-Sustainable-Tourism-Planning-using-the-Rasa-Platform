# nginx is the single public-facing process in the combined HuggingFace
# Spaces image (docker/spaces/Dockerfile) - it serves the built frontend
# and reverse-proxies API calls to the Rasa server and admin server, which
# both run on localhost inside the same container (see start.sh).

server {
    listen 7860;
    server_name _;

    root /app/frontend/dist;
    index index.html;

    # Rasa server: the REST channel webhook and the admin dashboard's
    # tracker lookup (see frontend/src/admin.jsx's RASA_API usage).
    location /webhooks/ {
        proxy_pass http://127.0.0.1:5005;
        proxy_set_header Host $host;
    }

    location /conversations/ {
        proxy_pass http://127.0.0.1:5005;
        proxy_set_header Host $host;
    }

    location /status {
        proxy_pass http://127.0.0.1:5005;
    }

    # Admin analytics/handover API.
    location /api/admin/ {
        proxy_pass http://127.0.0.1:8060/api/admin/;
        proxy_set_header Host $host;
    }

    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Single-page app fallback for the traveler UI and /admin dashboard.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
